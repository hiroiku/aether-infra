---
# ---------------------------------------------------------------------------
# ホスト
# ---------------------------------------------------------------------------
# Incus を操作する非 root ユーザー（incus-admin グループに入れる）
incus_admin_user: ubuntu

# ---------------------------------------------------------------------------
# Incus ネットワーク / ストレージ
# ---------------------------------------------------------------------------
incus_bridge: incusbr0
incus_bridge_cidr: "10.10.0.1/24"
# コンテナ名は <プロジェクト名>.{{ incus_dns_domain }} で解決される
incus_dns_domain: aether

incus_storage_pool: default
# btrfs を使う。ZFS は ARC がメモリを食うため、小さい VPS では不利。
incus_storage_driver: btrfs
incus_storage_size: 60GiB

# ---------------------------------------------------------------------------
# コンテナのデフォルト
# ---------------------------------------------------------------------------
container_user: dev
base_image_source: "images:ubuntu/26.04"
golden_image_alias: dev-base

# newproj の既定値
default_memory: 1GiB
default_cpu: 2

# ---------------------------------------------------------------------------
# エージェント CLI
# ---------------------------------------------------------------------------
# true にすると、コンテナ内で agent-update.timer（毎日）が有効になる。
# Claude Code のネイティブ版は元々自前で自動更新するため、
# このタイマーは主に Codex を最新に保つためのもの。
agents_auto_update: true
